<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌳 Родословное древо</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    min-height: 100vh;
    color: #fff;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #4a1d6e 70%, #6b2c91 100%);
    background-attachment: fixed;
    overflow-x: auto;
    position: relative;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.5; z-index: 0; pointer-events: none;
  }
  body::before {
    width: 450px; height: 450px;
    background: radial-gradient(circle, #ff6b9d, transparent 70%);
    top: -120px; left: -120px;
    animation: float1 18s ease-in-out infinite;
  }
  body::after {
    width: 550px; height: 550px;
    background: radial-gradient(circle, #4fc3f7, transparent 70%);
    bottom: -180px; right: -180px;
    animation: float2 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(120px, 120px) scale(1.2); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-120px, -120px) scale(1.15); }
  }

  header {
    text-align: center; padding: 40px 20px 20px; position: relative; z-index: 1;
  }
  h1 {
    font-family: 'Marck Script', cursive;
    font-size: 3.2em;
    background: linear-gradient(135deg, #ffd700 0%, #ff6b9d 50%, #4fc3f7 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 15px rgba(255, 215, 0, 0.5));
    margin-bottom: 10px;
  }
  .subtitle { color: #e0c8ff; font-size: 1.15em; letter-spacing: 1px; }
  .hint {
    margin-top: 15px; color: #c8b3e0; font-size: 0.95em;
    padding: 8px 20px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px; display: inline-block;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
  }
  .counter {
    margin-top: 10px; color: #ffd700; font-weight: 700; font-size: 0.95em;
  }

  .tree-scroll {
    overflow-x: auto; padding: 40px 20px;
    -webkit-overflow-scrolling: touch;
    position: relative; z-index: 1;
  }
  .tree-scroll::-webkit-scrollbar { height: 10px; }
  .tree-scroll::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.05); border-radius: 5px;
  }
  .tree-scroll::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, #ffd700, #ff6b9d);
    border-radius: 5px;
  }
  .tree-container {
    position: relative; display: inline-block;
    padding: 20px 40px; min-width: 100%;
  }
  #svg-lines {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 0; overflow: visible;
  }

  .tree-grid {
    display: inline-grid;
    grid-template-columns: repeat(4, 250px);
    row-gap: 85px; column-gap: 20px;
    position: relative; z-index: 1;
  }

  .couple {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 26px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    justify-self: center; align-self: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
  }
  .couple.main {
    background: rgba(255, 215, 0, 0.12);
    border-color: rgba(255, 215, 0, 0.4);
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.35),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
  }

  .person-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px;
    border-radius: 18px;
    min-width: 105px; max-width: 120px;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    user-select: none;
  }
  .person-card.male {
    background: linear-gradient(135deg, #1976d2 0%, #29b6f6 50%, #4fc3f7 100%);
    box-shadow: 0 6px 22px rgba(79, 195, 247, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .person-card.female {
    background: linear-gradient(135deg, #c2185b 0%, #ec407a 50%, #ff6b9d 100%);
    box-shadow: 0 6px 22px rgba(236, 64, 122, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .person-card.unknown {
    background: linear-gradient(135deg, #4a4a5e, #6b6b80);
    box-shadow: 0 6px 22px rgba(100,100,120,0.4);
    font-style: italic;
  }
  .person-card:hover {
    transform: translateY(-6px) scale(1.07);
    box-shadow: 0 16px 40px rgba(255, 215, 0, 0.55);
    z-index: 10;
  }
  .person-card::after {
    content: '✨';
    position: absolute;
    top: -8px; right: -8px;
    font-size: 1.2em;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .person-card:hover::after {
    opacity: 1;
    animation: sparkle 1s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(1) rotate(0); }
    50%      { transform: scale(1.4) rotate(20deg); }
  }

  .couple.main .person-card {
    box-shadow: 0 0 0 3px #ffd700,
                0 6px 30px rgba(255, 215, 0, 0.6),
                inset 0 1px 0 rgba(255,255,255,0.4);
    animation: mainGlow 2.5s ease-in-out infinite alternate;
  }
  @keyframes mainGlow {
    from {
      box-shadow: 0 0 0 3px #ffd700,
                  0 6px 30px rgba(255, 215, 0, 0.5),
                  inset 0 1px 0 rgba(255,255,255,0.4);
    }
    to {
      box-shadow: 0 0 0 3px #ffd700,
                  0 6px 50px rgba(255, 215, 0, 0.9),
                  inset 0 1px 0 rgba(255,255,255,0.4);
    }
  }

  /* ✅ ИСПРАВЛЕНО: абсолютный img не ломает вёрстку */
  .avatar {
    position: relative;
    width: 58px; height: 58px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6em; font-weight: 900;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.6);
    margin-bottom: 8px;
    overflow: hidden;
    box-shadow: inset 0 0 15px rgba(255,255,255,0.25),
                0 2px 8px rgba(0,0,0,0.2);
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .name {
    font-weight: 700; font-size: 0.95em; line-height: 1.15;
    text-align: center;
  }

  .plus {
    color: #ff4081;
    font-size: 1.5em;
    text-shadow: 0 0 12px rgba(255, 64, 129, 0.9);
    align-self: center;
    filter: drop-shadow(0 0 6px rgba(255, 64, 129, 0.7));
    animation: pulse 2s ease-in-out infinite;
    padding: 0 2px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }

  .legend {
    display: flex; justify-content: center; gap: 30px;
    margin-top: 40px; padding: 15px;
    color: #e0c8ff; font-size: 0.9em; flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot {
    width: 16px; height: 16px; border-radius: 5px;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .legend-dot.male    { background: linear-gradient(135deg, #1976d2, #4fc3f7); }
  .legend-dot.female  { background: linear-gradient(135deg, #c2185b, #ff6b9d); }
  .legend-dot.unknown { background: linear-gradient(135deg, #4a4a5e, #6b6b80); }
  .legend-dot.main    { background: linear-gradient(135deg, #ffd700, #ff9f43); }

  /* ========== МОДАЛЬНОЕ ОКНО ========== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 5, 20, 0.75);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal {
    background: linear-gradient(135deg, #2d1b4e 0%, #4a1d6e 100%);
    border: 2px solid rgba(255, 215, 0, 0.4);
    border-radius: 28px;
    padding: 40px 35px 35px;
    max-width: 460px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 25px 70px rgba(0,0,0,0.7),
                0 0 80px rgba(255, 215, 0, 0.25);
    transform: scale(0.75) translateY(20px);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .modal-overlay.active .modal { transform: scale(1) translateY(0); }
  .modal-close {
    position: absolute; top: 14px; right: 18px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #ffd700;
    font-size: 1.6em; line-height: 1;
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover {
    background: rgba(255, 215, 0, 0.25);
    transform: rotate(90deg) scale(1.1);
  }

  /* ✅ ИСПРАВЛЕНО: абсолютный img + буква-fallback */
  .modal-avatar {
    position: relative;
    width: 120px; height: 120px;
    border-radius: 50%;
    margin: 0 auto 20px;
    border: 4px solid rgba(255, 215, 0, 0.75);
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.6),
                inset 0 0 20px rgba(255,255,255,0.15);
    overflow: hidden;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .modal-initial {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3em; font-weight: 900;
  }
  .modal-avatar.male    { background: linear-gradient(135deg, #1976d2, #4fc3f7); }
  .modal-avatar.female  { background: linear-gradient(135deg, #c2185b, #ff6b9d); }
  .modal-avatar.unknown { background: linear-gradient(135deg, #4a4a5e, #6b6b80); }
  .modal-avatar img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .modal-name {
    font-family: 'Marck Script', cursive;
    font-size: 2.4em; text-align: center;
    background: linear-gradient(135deg, #ffd700, #ff6b9d);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.4));
    margin-bottom: 6px;
  }
  .modal-badge {
    display: block; width: fit-content;
    margin: 0 auto 18px;
    padding: 5px 16px;
    background: rgba(255, 215, 0, 0.15);
    border: 1px solid rgba(255, 215, 0, 0.4);
    border-radius: 20px;
    color: #ffd700;
    font-size: 0.9em; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .modal-actions {
    display: flex; gap: 10px; justify-content: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .btn-photo {
    background: linear-gradient(135deg, #ffd700, #ff9f43);
    color: #2d1b4e;
    border: none;
    padding: 10px 20px;
    border-radius: 14px;
    font-weight: 800;
    font-family: inherit;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
  }
  .btn-photo:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
  }
  .btn-photo:disabled { opacity: 0.6; cursor: wait; }
  .btn-remove {
    background: rgba(255, 100, 100, 0.15);
    color: #ff8080;
    border: 1px solid rgba(255, 100, 100, 0.4);
    box-shadow: none;
  }
  .btn-remove:hover:not(:disabled) {
    background: rgba(255, 100, 100, 0.3);
    box-shadow: 0 4px 15px rgba(255, 100, 100, 0.4);
  }

  .modal-info {
    width: 100%; display: flex; flex-direction: column; gap: 14px;
  }
  .info-row {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .info-label {
    font-size: 0.85em; font-weight: 700;
    color: #c8b3e0; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .info-value { color: #fff; font-size: 1em; line-height: 1.6; }
  .link-btn {
    background: rgba(255, 215, 0, 0.12);
    color: #ffd700;
    border: 1px solid rgba(255, 215, 0, 0.35);
    padding: 4px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit; font-size: 0.95em; font-weight: 700;
    transition: all 0.2s;
    margin: 2px;
  }
  .link-btn:hover {
    background: rgba(255, 215, 0, 0.3);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255, 215, 0, 0.35);
  }
  .plus-small { color: #ff6b9d; font-weight: 900; }
  .empty { color: #8b7ba5; font-style: italic; }

  @media (max-width: 800px) {
    h1 { font-size: 2.2em; }
    .tree-grid { grid-template-columns: repeat(4, 220px); row-gap: 70px; }
    .person-card { min-width: 92px; padding: 10px 12px; }
    .avatar { width: 48px; height: 48px; font-size: 1.3em; }
    .name { font-size: 0.85em; }
    .modal { padding: 30px 22px 25px; }
    .modal-name { font-size: 1.9em; }
    .modal-avatar { width: 100px; height: 100px; }
    .modal-initial { font-size: 2.5em; }
  }
</style>
</head>
<body>

<header>
  <h1>🌳 Родословное древо</h1>
  <p class="subtitle">✨ Наша семья — наша история ✨</p>
  <p class="hint">💡 Нажми на человека, чтобы увидеть карточку и загрузить фото</p>
  <p class="counter" id="counter"></p>
</header>

<div class="tree-scroll">
  <div class="tree-container" id="container">
    <svg id="svg-lines">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <div class="tree-grid">

      <div class="couple" data-couple-id="gataulla" style="grid-row:1;grid-column:1;">
        <div class="person-card" data-id="gataulla"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="unknown1"></div>
      </div>

      <div class="couple" data-couple-id="nabiulla" style="grid-row:2;grid-column:1;">
        <div class="person-card" data-id="nabiulla"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="golzhamal"></div>
      </div>
      <div class="couple" data-couple-id="muhamedzakir" style="grid-row:2;grid-column:3;">
        <div class="person-card" data-id="muhamedzakir"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="hatima"></div>
      </div>

      <div class="couple" data-couple-id="habibulla" style="grid-row:3;grid-column:1;">
        <div class="person-card" data-id="habibulla"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="zaytuna1"></div>
      </div>
      <div class="couple" data-couple-id="minehmmet" style="grid-row:3;grid-column:2;">
        <div class="person-card" data-id="minehmmet"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="mingayan"></div>
      </div>
      <div class="couple" data-couple-id="vagiz" style="grid-row:3;grid-column:3;">
        <div class="person-card" data-id="vagiz"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="monira"></div>
      </div>
      <div class="couple" data-couple-id="shafigulla" style="grid-row:3;grid-column:4;">
        <div class="person-card" data-id="shafigulla"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="zaytuna2"></div>
      </div>

      <div class="couple" data-couple-id="ahmadulla" style="grid-row:4;grid-column:1/span 2;">
        <div class="person-card" data-id="ahmadulla"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="minsylu"></div>
      </div>
      <div class="couple" data-couple-id="gumer" style="grid-row:4;grid-column:3/span 2;">
        <div class="person-card" data-id="gumer"></div>
        <div class="plus">♥</div>
        <div class="person-card" data-id="asiya"></div>
      </div>

      <div class="couple main" data-couple-id="airat" style="grid-row:5;grid-column:1/span 4;">
        <div class="person-card" data-id="airat"></div>
        <div class="plus">❤</div>
        <div class="person-card" data-id="raufa"></div>
      </div>

      <div style="grid-row:6;grid-column:2;justify-self:center;align-self:center;">
        <div class="person-card" data-id="adilya"></div>
      </div>
      <div style="grid-row:6;grid-column:3;justify-self:center;align-self:center;">
        <div class="person-card" data-id="anisa"></div>
      </div>

    </div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot male"></span> Мужчина</div>
  <div class="legend-item"><span class="legend-dot female"></span> Женщина</div>
  <div class="legend-item"><span class="legend-dot unknown"></span> Неизвестно</div>
  <div class="legend-item"><span class="legend-dot main"></span> Основная чета</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" aria-label="Закрыть">✕</button>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script>
/* =====================================================
   ДАННЫЕ О ЧЕЛОВЕКЕ
   photo: null — буква-заглушка
   Загрузка фото — через кнопку в карточке (автосохранение)
   ===================================================== */
const people = {
  gataulla:     { name:'Гатаулла',     gender:'male',    bio:'Пра-пра-прадедушка', photo:null, parentIds:[],                          spouseId:'unknown1',      childrenIds:['nabiulla'] },
  unknown1:     { name:'?',            gender:'unknown', bio:'Имя неизвестно',     photo:null, parentIds:[],                          spouseId:'gataulla',      childrenIds:['nabiulla'] },

  nabiulla:     { name:'Набиулла',     gender:'male',    bio:'Пра-прадедушка',     photo:null, parentIds:['gataulla','unknown1'],     spouseId:'golzhamal',     childrenIds:['habibulla'] },
  golzhamal:    { name:'Голжамал',     gender:'female',  bio:'Пра-прабабушка',     photo:null, parentIds:[],                          spouseId:'nabiulla',      childrenIds:['habibulla'] },
  muhamedzakir: { name:'Мухамедзакир', gender:'male',    bio:'Пра-прадедушка',     photo:null, parentIds:[],                          spouseId:'hatima',        childrenIds:['vagiz'] },
  hatima:       { name:'Хатима',       gender:'female',  bio:'Пра-прабабушка',     photo:null, parentIds:[],                          spouseId:'muhamedzakir',  childrenIds:['vagiz'] },

  habibulla:    { name:'Хабибулла',    gender:'male',    bio:'Прадедушка',         photo:null, parentIds:['nabiulla','golzhamal'],    spouseId:'zaytuna1',      childrenIds:['ahmadulla'] },
  zaytuna1:     { name:'Зайтуна',      gender:'female',  bio:'Прабабушка',         photo:null, parentIds:[],                          spouseId:'habibulla',     childrenIds:['ahmadulla'] },
  minehmmet:    { name:'Минәхмәт',     gender:'male',    bio:'Прадедушка',         photo:null, parentIds:[],                          spouseId:'mingayan',      childrenIds:['minsylu'] },
  mingayan:     { name:'Мингаян',      gender:'female',  bio:'Прабабушка',         photo:null, parentIds:[],                          spouseId:'minehmmet',     childrenIds:['minsylu'] },
  vagiz:        { name:'Вагиз',        gender:'male',    bio:'Прадедушка',         photo:null, parentIds:['muhamedzakir','hatima'],   spouseId:'monira',        childrenIds:['gumer'] },
  monira:       { name:'Мөнирә',       gender:'female',  bio:'Прабабушка',         photo:null, parentIds:[],                          spouseId:'vagiz',         childrenIds:['gumer'] },
  shafigulla:   { name:'Шафигулла',    gender:'male',    bio:'Прадедушка',         photo:null, parentIds:[],                          spouseId:'zaytuna2',      childrenIds:['asiya'] },
  zaytuna2:     { name:'Зайтуна',      gender:'female',  bio:'Прабабушка',         photo:null, parentIds:[],                          spouseId:'shafigulla',    childrenIds:['asiya'] },

  ahmadulla:    { name:'Ахмадулла',    gender:'male',    bio:'Дедушка',            photo:null, parentIds:['habibulla','zaytuna1'],    spouseId:'minsylu',       childrenIds:['airat'] },
  minsylu:      { name:'Минсылу',      gender:'female',  bio:'Бабушка',            photo:null, parentIds:['minehmmet','mingayan'],    spouseId:'ahmadulla',     childrenIds:['airat'] },
  gumer:        { name:'Гумер',        gender:'male',    bio:'Дедушка',            photo:null, parentIds:['vagiz','monira'],          spouseId:'asiya',         childrenIds:['raufa'] },
  asiya:        { name:'Асия',         gender:'female',  bio:'Бабушка',            photo:null, parentIds:['shafigulla','zaytuna2'],   spouseId:'gumer',         childrenIds:['raufa'] },

  airat:        { name:'Айрат',        gender:'male',    bio:'Папа',               photo:null, parentIds:['ahmadulla','minsylu'],     spouseId:'raufa',         childrenIds:['adilya','anisa'], isMain:true },
  raufa:        { name:'Рауфа',        gender:'female',  bio:'Мама',               photo:null, parentIds:['gumer','asiya'],           spouseId:'airat',         childrenIds:['adilya','anisa'], isMain:true },

  adilya:       { name:'Адиля',        gender:'female',  bio:'Дочь',               photo:null, parentIds:['airat','raufa'],           childrenIds:[] },
  anisa:        { name:'Аниса',        gender:'female',  bio:'Дочь',               photo:null, parentIds:['airat','raufa'],           childrenIds:[] }
};

/* ========= Связи для линий ========= */
const connections = [
  { from:'gataulla',     to:'nabiulla'   },
  { from:'nabiulla',     to:'habibulla'  },
  { from:'habibulla',    to:'ahmadulla'  },
  { from:'minehmmet',    to:'ahmadulla'  },
  { from:'ahmadulla',    to:'airat'      },
  { from:'muhamedzakir', to:'vagiz'      },
  { from:'vagiz',        to:'gumer'      },
  { from:'shafigulla',   to:'gumer'      },
  { from:'gumer',        to:'airat'      },
  { from:'airat',        to:'adilya'     },
  { from:'airat',        to:'anisa'      },
];

/* ========= Хранилище фото (localStorage) ========= */
const STORAGE_KEY = 'family-tree-photos-v1';

function loadPhotos() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    for (const [id, dataUrl] of Object.entries(saved)) {
      if (people[id] && typeof dataUrl === 'string' && dataUrl.startsWith('data:')) {
        people[id].photo = dataUrl;
      }
    }
  } catch (e) {
    console.warn('Не удалось загрузить сохранённые фото:', e);
  }
}

function savePhoto(id, dataUrl) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (dataUrl) saved[id] = dataUrl;
    else delete saved[id];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    return true;
  } catch (e) {
    console.error('Ошибка сохранения фото:', e);
    alert('Не удалось сохранить фото. Возможно, закончилось место в браузере.');
    return false;
  }
}

/* ========= Сжатие фото: квадрат 400×400, JPEG ========= */
function resizeImage(file, size = 400) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error('Это не изображение'));
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const ratio = Math.max(size / img.width, size / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;
        const x = (size - w) / 2;
        const y = (size - h) / 2;
        ctx.fillStyle = '#2d1b4e';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, x, y, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => reject(new Error('Не удалось прочитать изображение'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
    reader.readAsDataURL(file);
  });
}

/* ========= Наполнение карточек ========= */
function fillCards() {
  document.querySelectorAll('.person-card[data-id]').forEach(card => {
    const id = card.dataset.id;
    const p = people[id];
    if (!p) return;

    card.className = 'person-card ' + p.gender;
    card.title = `${p.name} — ${p.bio}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = p.name === '?' ? '?' : p.name.charAt(0);

    if (p.photo) {
      const img = document.createElement('img');
      img.src = p.photo;
      img.alt = p.name;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = () => {
        console.warn(`⚠️ Не удалось показать фото для «${p.name}»`);
        img.remove();
      };
      avatar.appendChild(img);
    }

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;

    card.innerHTML = '';
    card.appendChild(avatar);
    card.appendChild(name);
  });

  const named = Object.values(people).filter(p => p.name !== '?').length;
  document.getElementById('counter').textContent =
    `👥 ${named} человек в дереве (${Object.keys(people).length - named} неизвестно)`;
}

/* Обновить карточку одного человека (после загрузки/удаления фото) */
function refreshCard(id) {
  const card = document.querySelector(`.person-card[data-id="${id}"]`);
  if (!card) return;
  const p = people[id];
  const avatar = card.querySelector('.avatar');
  if (!avatar) return;
  avatar.textContent = p.name === '?' ? '?' : p.name.charAt(0);
  if (p.photo) {
    const img = document.createElement('img');
    img.src = p.photo;
    img.alt = p.name;
    img.onerror = () => img.remove();
    avatar.appendChild(img);
  }
}

/* ========= Рисование линий ========= */
function drawLines() {
  const container = document.getElementById('container');
  const svg = document.getElementById('svg-lines');
  svg.querySelectorAll('path').forEach(p => p.remove());

  const cr = container.getBoundingClientRect();
  const w = container.offsetWidth, h = container.offsetHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  // Собираем уникальные id из connections
  const ids = new Set();
  connections.forEach(c => { ids.add(c.from); ids.add(c.to); });

  const nodes = {};
  ids.forEach(id => {
    // Приоритет — обёртка пары (если есть), иначе — карточка одиночки
    const el = document.querySelector(`[data-couple-id="${id}"]`)
            || document.querySelector(`.person-card[data-id="${id}"]`);
    if (!el) return;
    const r = el.getBoundingClientRect();
    nodes[id] = {
      cx: r.left - cr.left + r.width / 2,
      top: r.top - cr.top,
      bottom: r.bottom - cr.top,
    };
  });

  connections.forEach(c => {
    const a = nodes[c.from], b = nodes[c.to];
    if (!a || !b) return;
    const midY = a.bottom + (b.top - a.bottom) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${a.cx} ${a.bottom} L ${a.cx} ${midY} L ${b.cx} ${midY} L ${b.cx} ${b.top}`);
    path.setAttribute('stroke', '#ffd700');
    path.setAttribute('stroke-opacity', '0.65');
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('filter', 'url(#glow)');
    svg.appendChild(path);
  });
}

/* ========= Модальное окно ========= */
const modal = document.getElementById('modal');
const content = document.getElementById('modal-content');
const closeBtn = modal.querySelector('.modal-close');

function makeLink(id) {
  return `<button class="link-btn" data-goto="${id}">${people[id].name}</button>`;
}

function openModal(id) {
  const p = people[id];
  if (!p) return;

  const initial = p.name === '?' ? '?' : p.name.charAt(0);
  const imgHTML = p.photo
    ? `<img src="${p.photo}" alt="${p.name}" onerror="this.remove()">`
    : '';

  const parentsHTML = (p.parentIds && p.parentIds.length)
    ? p.parentIds.map(makeLink).join(' <span class="plus-small">+</span> ')
    : '<span class="empty">неизвестны</span>';
  const spouseHTML = p.spouseId
    ? makeLink(p.spouseId)
    : '<span class="empty">—</span>';
  const childrenHTML = (p.childrenIds && p.childrenIds.length)
    ? p.childrenIds.map(makeLink).join(', ')
    : '<span class="empty">—</span>';

  content.innerHTML = `
    <div class="modal-avatar ${p.gender}">
      <span class="modal-initial">${initial}</span>
      ${imgHTML}
    </div>
    <h2 class="modal-name">${p.name}</h2>
    <div class="modal-badge">${p.bio}</div>
    <div class="modal-actions">
      <button class="btn-photo" id="btn-upload">📷 ${p.photo ? 'Заменить фото' : 'Загрузить фото'}</button>
      ${p.photo ? '<button class="btn-photo btn-remove" id="btn-remove-photo">🗑️ Удалить</button>' : ''}
    </div>
    <input type="file" id="photo-input" accept="image/*" hidden>
    <div class="modal-info">
      <div class="info-row">
        <span class="info-label">🌱 Родители</span>
        <span class="info-value">${parentsHTML}</span>
      </div>
      <div class="info-row">
        <span class="info-label">💕 Супруг(а)</span>
        <span class="info-value">${spouseHTML}</span>
      </div>
      <div class="info-row">
        <span class="info-label">👶 Дети</span>
        <span class="info-value">${childrenHTML}</span>
      </div>
    </div>
  `;

  modal.classList.add('active');

  // Кнопки навигации
  content.querySelectorAll('.link-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.goto));
  });

  // Загрузка фото
  const uploadBtn = content.querySelector('#btn-upload');
  const removeBtn = content.querySelector('#btn-remove-photo');
  const input = content.querySelector('#photo-input');

  uploadBtn.addEventListener('click', () => input.click());

  input.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const originalText = uploadBtn.textContent;
    try {
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ Обработка...';
      const dataUrl = await resizeImage(file);
      p.photo = dataUrl;
      if (savePhoto(id, dataUrl)) {
        refreshCard(id);
        openModal(id); // перерисовать модалку
        setTimeout(drawLines, 50);
      } else {
        p.photo = null;
        uploadBtn.disabled = false;
        uploadBtn.textContent = originalText;
      }
    } catch (err) {
      console.error(err);
      alert('Ошибка загрузки фото: ' + err.message);
      uploadBtn.disabled = false;
      uploadBtn.textContent = originalText;
    }
  });

  if (removeBtn) {
    removeBtn.addEventListener('click', () => {
      if (!confirm(`Удалить фото «${p.name}»?`)) return;
      p.photo = null;
      savePhoto(id, null);
      refreshCard(id);
      openModal(id);
      setTimeout(drawLines, 50);
    });
  }
}

function closeModal() {
  modal.classList.remove('active');
}

closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ========= Инициализация ========= */
document.addEventListener('DOMContentLoaded', () => {
  loadPhotos();
  fillCards();

  document.querySelectorAll('.person-card[data-id]').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      openModal(card.dataset.id);
    });
  });

  drawLines();
  setTimeout(drawLines, 200);
  setTimeout(drawLines, 800);
  window.addEventListener('resize', () => {
    clearTimeout(window._t);
    window._t = setTimeout(drawLines, 120);
  });
  if (document.fonts) document.fonts.ready.then(drawLines);
});
</script>
